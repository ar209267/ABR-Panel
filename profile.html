<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f1f5f9;
    font-family:Segoe UI;
}

.profile-box{
    max-width:500px;
    margin:auto;
    margin-top:40px;
}

.card-box{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.balance{
    font-size:35px;
    font-weight:bold;
    color:#198754;
}

.btn-custom{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="profile-box">

    <div class="card-box text-center">

        <img src="https://i.imgur.com/6VBx3io.png"
        width="90"
        class="rounded-circle mb-3">

        <h3 class="fw-bold">
            ABR USER
        </h3>

        <p class="text-muted">
            Premium Member
        </p>

    </div>

    <div class="card-box text-center">

        <p class="mb-1 text-muted">
            Available Balance
        </p>

        <div class="balance">
            ৳ 0.00
        </div>

    </div>

    <div class="card-box">

        <button
        onclick="window.location.href='add-funds.html'"
        class="btn btn-success btn-custom">

        ADD FUNDS

        </button>

        <button
        class="btn btn-primary btn-custom">

        TRANSACTION HISTORY

        </button>

        <button
        class="btn btn-dark btn-custom">

        MY ORDERS

        </button>

        <button
        onclick="window.location.href='index.html'"
        class="btn btn-danger btn-custom">

        LOGOUT

        </button>

    </div>

</div>

</div>

</body>
</html>
