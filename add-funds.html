<!DOCTYPE html>
<html>
<head>
<title>Add Funds</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-3">

<div class="card p-3">

<h3>Add Funds</h3>

<h5>Bkash: +8801766380931</h5>

<input class="form-control mb-2" placeholder="Number">
<input id="amount" class="form-control mb-2" placeholder="Amount">
<input class="form-control mb-2" placeholder="TrxID">

<button class="btn btn-success w-100" onclick="addBal()">
Submit
</button>

<button class="btn btn-dark w-100 mt-2"
onclick="window.location.href='profile.html'">
Back
</button>

</div>

<script>

function addBal(){

let amt=document.getElementById("amount").value;

let current=localStorage.getItem("balance") || 0;

localStorage.setItem("balance",
parseFloat(current)+parseFloat(amt));

alert("Added!");

window.location.href="profile.html";

}

</script>

</body>
</html>
