<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Funds - ABR Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; }
        .payment-card { background: #1e1e1e; padding: 30px; border-radius: 20px; max-width: 400px; margin: 0 auto; border: 1px solid #ff8c00; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #ff8c00; margin-bottom: 10px; }
        p { font-size: 14px; color: #bbb; margin-bottom: 25px; }
        .method { background: #2a2a2a; margin: 12px 0; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #ff8c00; }
        .method span { font-weight: bold; color: #ddd; }
        .method strong { color: #fff; font-size: 1.1em; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; box-sizing: border-box; }
        .btn-whatsapp { background: #25d366; color: white; padding: 15px; text-decoration: none; border-radius: 10px; display: block; margin-top: 20px; font-weight: bold; transition: 0.3s; }
        .btn-whatsapp:hover { background: #1da851; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="payment-card">
    <h2>Add Funds</h2>
    <p>নিচের নাম্বারে টাকা পাঠিয়ে আপনার তথ্য দিন।</p>
    
    <div class="method">
        <span>Bkash (Personal)</span>
        <strong>01766380931</strong>
    </div>
    
    <div class="method">
        <span>Nagad (Personal)</span>
        <strong>01766380931</strong>
    </div>

    <hr style="border: 0.5px solid #333; margin: 20px 0;">
    
    <input type="number" id="amount" placeholder="কত টাকা বা ডলার পাঠিয়েছেন?">
    <input type="text" id="trxid" placeholder="Transaction ID (TrxID) লিখুন">
    
    <a href="javascript:void(0)" onclick="sendToWhatsApp()" class="btn-whatsapp">হোয়াটসঅ্যাপে তথ্য পাঠান</a>
</div>

<script>
function sendToWhatsApp() {
    let amount = document.getElementById('amount').value;
    let trxid = document.getElementById('trxid').value;
    let phone = "8801766380931"; 
    
    if(amount == "" || trxid == "") {
        alert("দয়া করে পরিমাণ এবং TrxID লিখুন।");
        return;
    }

    let message = `*Payment Confirmation Request*%0A--------------------------%0A*Amount:* ${amount}%0A*TrxID:* ${trxid}%0A--------------------------%0Aআমার একাউন্টে ব্যালেন্স যোগ করে দিন।`;
    window.location.href = `https://wa.me/${phone}?text=${message}`;
}
</script>

</body>
</html>
