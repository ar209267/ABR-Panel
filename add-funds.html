<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABR PANEL - Add Funds</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6fb;
    font-family:Segoe UI;
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    font-size:26px;
    font-weight:bold;
    color:#0d6efd;
}

/* CARD */
.pay-card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
    cursor:pointer;
    transition:0.3s;
}

.pay-card:hover{
    transform:scale(1.02);
    border:1px solid #0d6efd;
}

/* LOGO */
.pay-card img{
    width:45px;
    height:45px;
    object-fit:contain;
}

/* FORM */
.box{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.btn-pay{
    width:100%;
    padding:12px;
    font-weight:bold;
    border-radius:10px;
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
ABR PANEL
</div>

<div class="container">

<!-- PAYMENT METHODS -->
<div class="box">

<h5 class="mb-3 fw-bold">Payment Methods</h5>

<div class="pay-card">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/68/BKash_logo.png">
<div>
<b>bKash Personal</b><br>
<small>Send Money: <b>+8801766380931</b></small>
</div>
</div>

<div class="pay-card">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Nagad-Logo.wine.png">
<div>
<b>Nagad Personal</b><br>
<small>Send Money: <b>01766380931</b></small>
</div>
</div>

<div class="pay-card">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/72/Rocket_logo.svg">
<div>
<b>Rocket</b><br>
<small>Send Money: <b>01766380931</b></small>
</div>
</div>

</div>

<!-- PAYMENT FORM -->
<div class="box">

<h5 class="fw-bold mb-3">Submit Payment</h5>

<input id="number" class="form-control mb-2" placeholder="Your Number">

<input id="amount" type="number" class="form-control mb-2" placeholder="Amount">

<input id="trx" class="form-control mb-2" placeholder="Transaction ID">

<button class="btn btn-success btn-pay" onclick="submitPay()">
SUBMIT PAYMENT
</button>

</div>

<!-- BACK -->
<button class="btn btn-dark btn-pay mt-3"
onclick="window.location.href='index.html'">
BACK TO DASHBOARD
</button>

</div>

<script>

function submitPay(){

let n=document.getElementById("number").value;
let a=document.getElementById("amount").value;
let t=document.getElementById("trx").value;

if(!n || !a || !t){
alert("Please fill all fields");
return;
}

alert("Payment Submitted Successfully! Admin will verify.");

}

</script>

</body>
</html>
