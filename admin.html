<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - AR Rocky FN</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{font-family:Segoe UI;background:#f4f6fb}
.card-box{background:#fff;padding:15px;margin:10px;border-radius:12px}
</style>

</head>

<body>

<div class="container">

<h3 class="text-center text-danger mt-3">
ADMIN PANEL
</h3>

<h5>All Orders</h5>

<div id="orders"></div>

</div>

<script type="module">

import { db } from "./app.js";
import { collection, getDocs, updateDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

async function loadOrders(){

let snap = await getDocs(collection(db,"orders"));

snap.forEach(d=>{

let x=d.data();

document.getElementById("orders").innerHTML += `

<div class="card-box">

<b>${x.service}</b><br>
Qty: ${x.qty}<br>
Price: $${x.price}<br>
Status: ${x.status || "pending"}

<br><br>

<button class="btn btn-success btn-sm"
onclick="approve('${d.id}')">
Approve
</button>

<button class="btn btn-danger btn-sm"
onclick="reject('${d.id}')">
Reject
</button>

</div>

`;

});

}

window.approve = async function(id){

await updateDoc(doc(db,"orders",id),{
status:"approved"
});

alert("Approved");

location.reload();

}

window.reject = async function(id){

await updateDoc(doc(db,"orders",id),{
status:"rejected"
});

alert("Rejected");

location.reload();

}

loadOrders();

</script>

</body>
</html>
