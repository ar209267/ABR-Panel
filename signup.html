<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ABR Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        .signup-card { background-color: #1e293b; padding: 30px; border-radius: 15px; width: 100%; max-width: 400px; }
        .form-control { background-color: #334155; border: 1px solid #475569; color: white; }
    </style>
</head>
<body>
<div class="signup-card">
    <h3 class="text-center text-info mb-4">Create Account</h3>
    <form action="login.html">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign Up Now</button>
    </form>
</div>
</body>
</html>
