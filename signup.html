<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | ABR Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-glass">
        <div class="auth-header">
            <h1>ABR<span>Panel</span></h1>
            <p>Create your account to get started</p>
        </div>
        <form onsubmit="event.preventDefault(); window.location.href='login.html';">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Atiqur Rahman" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-main">Create Account</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>
</body>
</html>
