<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABR PANEL</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f0f2f5;font-family:Segoe UI}

#dashboard{display:none;padding:20px}

.login-box{
max-width:400px;
margin:auto;
margin-top:100px;
}

.card-box{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:15px;
}

.service-card{
background:#fff;
padding:20px;
border-radius:12px;
text-align:center;
cursor:pointer;
}

.order-box{
display:none;
background:#fff;
padding:20px;
border-radius:12px;
margin-top:20px;
}
</style>

</head>
<body>

<!-- LOGIN -->
<div id="login-page" class="login-box">

<div class="card-box">

<h3 class="text-center">LOGIN</h3>

<input id="user" class="form-control mb-2" placeholder="Username">
<input id="pass" type="password" class="form-control mb-2" placeholder="Password">

<button class="btn btn-primary w-100" onclick="login()">
Login
</button>

</div>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

<h3>Dashboard</h3>

<h5 class="text-success">
Balance: ৳<span id="bal"></span>
</h5>

<div class="row g-2 mt-2">

<div class="col-6">
<div class="service-card" onclick="openService('fb')">Facebook</div>
</div>

<div class="col-6">
<div class="service-card" onclick="openService('yt')">YouTube</div>
</div>

<div class="col-6">
<div class="service-card" onclick="openService('ff')">Free Fire</div>
</div>

<div class="col-6">
<div class="service-card" onclick="window.location.href='profile.html'">Profile</div>
</div>

</div>

<!-- ORDER -->
<div id="order-box" class="order-box">

<h5 id="title"></h5>

<select id="service" class="form-select mb-2" onchange="calc()"></select>

<input id="qty" class="form-control mb-2" type="number" value="1000" oninput="calc()">

<h5>Total: $<span id="total">0</span></h5>

<button class="btn btn-warning w-100" onclick="window.location.href='profile.html'">
PLACE ORDER & PAY
</button>

</div>

</div>

<script>

// BALANCE
function getBal(){
return localStorage.getItem("balance") || 0;
}

document.getElementById("bal").innerText = getBal();

// LOGIN
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u && p){
document.getElementById("login-page").style.display="none";
document.getElementById("dashboard").style.display="block";
}else{
alert("Fill all fields");
}
}

// DATA
const data={
fb:{
title:"Facebook",
items:[
{name:"Followers",price:1.2},
{name:"Likes",price:0.4}
]},
yt:{
title:"YouTube",
items:[
{name:"Views",price:2},
{name:"Subs",price:5}
]},
ff:{
title:"Free Fire",
items:[
{name:"Diamonds",price:1}
]}
};

function openService(k){
let s=data[k];

document.getElementById("order-box").style.display="block";
document.getElementById("title").innerText=s.title;

let sel=document.getElementById("service");
sel.innerHTML="";

s.items.forEach(i=>{
let o=document.createElement("option");
o.value=i.price;
o.text=i.name;
sel.appendChild(o);
});

calc();
}

function calc(){
let price=document.getElementById("service").value;
let qty=document.getElementById("qty").value;

document.getElementById("total").innerText=
(price*qty/1000).toFixed(2);
}

</script>

</body>
</html>
