<script>

// ================================
// BASIC SECURITY SYSTEM
// ================================

// Disable Right Click
document.addEventListener('contextmenu', function(e){
    e.preventDefault();
});

// Disable Inspect Keys
document.onkeydown = function(e){

    // F12
    if(e.keyCode == 123){
        return false;
    }

    // CTRL + SHIFT + I
    if(e.ctrlKey && e.shiftKey && e.keyCode == 73){
        return false;
    }

    // CTRL + SHIFT + J
    if(e.ctrlKey && e.shiftKey && e.keyCode == 74){
        return false;
    }

    // CTRL + U
    if(e.ctrlKey && e.keyCode == 85){
        return false;
    }

};

// ================================
// LOGIN SECURITY
// ================================

function handleLogin(){

    const username =
    document.getElementById('user').value;

    const password =
    document.getElementById('pass').value;

    if(
        username === "admin" &&
        password === "12345"
    ){

        document.getElementById('login-page').style.display = 'none';

        document.getElementById('dashboard').style.display = 'block';

    }else{

        alert("Wrong Username or Password");

    }

}

// ================================
// SERVICE DATABASE
// ================================

const serviceData = {

    'fb': {
        title: "Facebook Services",
        options: [
            { name: "FB Page Followers", price: 1.20 },
            { name: "FB Video Views", price: 0.60 },
            { name: "FB Post Likes", price: 0.40 }
        ]
    },

    'yt': {
        title: "YouTube Services",
        options: [
            { name: "YT Watch Time", price: 12.50 },
            { name: "YT Subscribers", price: 4.80 },
            { name: "YT Views", price: 2.10 }
        ]
    },

    'ff': {
        title: "Free Fire Top-up",
        options: [
            { name: "115 Diamonds", price: 0.85 },
            { name: "240 Diamonds", price: 1.75 },
            { name: "Weekly Membership", price: 1.60 }
        ]
    },

    'id': {
        title: "ID Sale",
        options: [
            { name: "FF Level 60+ ID", price: 15.00 },
            { name: "Facebook Old Account", price: 2.00 }
        ]
    }

};

// ================================
// SHOW ORDER FORM
// ================================

function showOrderForm(cat){

    const data = serviceData[cat];

    document.getElementById('order-section').style.display = 'block';

    document.getElementById('category-title').innerText =
    data.title;

    let select =
    document.getElementById('service-select');

    select.innerHTML = '';

    data.options.forEach(opt => {

        let el = document.createElement('option');

        el.text = opt.name;

        el.value = opt.price;

        select.add(el);

    });

    updatePrice();

    window.scrollTo(0, document.body.scrollHeight);

}

// ================================
// PRICE UPDATE
// ================================

function updatePrice(){

    const price =
    document.getElementById('service-select').value;

    const qty =
    document.getElementById('qty').value;

    const bdtRate = 120;

    let totalUSD;

    const title =
    document.getElementById('category-title').innerText;

    if(
        title.includes("Top-up") ||
        title.includes("ID")
    ){

        totalUSD = price * 1;

        document.getElementById('qty').disabled = true;

    }else{

        totalUSD = (price * qty) / 1000;

        document.getElementById('qty').disabled = false;

    }

    document.getElementById('total-usd').innerText =
    '$' + totalUSD.toFixed(2);

    document.getElementById('total-bdt').innerText =
    '৳' + (totalUSD * bdtRate).toFixed(2);

}

</script>
