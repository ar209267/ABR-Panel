<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Rocky BD - Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#eef2f7;
    font-family:Segoe UI;
}

/* LOGIN */
.login-box{
    max-width:400px;
    margin:auto;
    margin-top:120px;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* DASHBOARD */
#dashboard{display:none;padding:20px}

.header{
    text-align:center;
    font-weight:bold;
    font-size:22px;
    color:#0d6efd;
    margin-bottom:20px;
}

.card-box{
    background:#fff;
    padding:15px;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    transition:0.2s;
    margin-bottom:10px;
}

.card-box:hover{
    transform:scale(1.03);
}

/* ORDER */
#order{
    display:none;
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

.total{
    font-weight:bold;
    color:#198754;
}

</style>

</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-box">

<h3 class="text-center text-primary">LOGIN</h3>

<input id="user" class="form-control mb-2" placeholder="Username">
<input id="pass" type="password" class="form-control mb-2" placeholder="Password">

<button class="btn btn-primary w-100" onclick="login()">
Login
</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="header">
AR Rocky FN PANEL
</div>

<div class="card-box" onclick="openService('fb')">Facebook Services</div>
<div class="card-box" onclick="openService('yt')">YouTube Services</div>
<div class="card-box" onclick="openService('ff')">Free Fire Services</div>
<div class="card-box" onclick="openService('id')">ID Sale Services</div>

<!-- ORDER -->
<div id="order">

<h5 id="title"></h5>

<select id="service" class="form-select mb-2" onchange="calc()"></select>

<input id="qty" class="form-control mb-2" value="1000" oninput="calc()">

<h5>Total: $<span class="total" id="total">0</span></h5>

<a href="add-funds.html" class="btn btn-warning w-100 mt-2">
PLACE ORDER & PAY
</a>

</div>

</div>

<script>

function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(!u || !p){
alert("Enter login details");
return;
}

document.getElementById("login").style.display="none";
document.getElementById("dashboard").style.display="block";
}

const data={

fb:{
title:"Facebook Services",
items:[
{name:"Page Promotion",price:1.2},
{name:"Post Boost",price:0.6}
]
},

yt:{
title:"YouTube Services",
items:[
{name:"Views Promotion",price:2},
{name:"Subscribers Growth",price:5}
]
},

ff:{
title:"Free Fire Services",
items:[
{name:"Diamonds Top-up",price:1},
{name:"Membership",price:2}
]
},

id:{
title:"ID Sale Services",
items:[
{name:"Game Account",price:10},
{name:"Old FB Account",price:3}
]
}

};

function openService(key){

let d=data[key];

document.getElementById("order").style.display="block";
document.getElementById("title").innerText=d.title;

let sel=document.getElementById("service");
sel.innerHTML="";

d.items.forEach(i=>{
let op=document.createElement("option");
op.value=i.price;
op.text=i.name;
sel.appendChild(op);
});

calc();

}

function calc(){

let p=document.getElementById("service").value;
let q=document.getElementById("qty").value;

if(!p || !q) return;

document.getElementById("total").innerText =
((p*q)/1000).toFixed(2);

}

</script>

</body>
</html>
