<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABR PRO | Premium SMM Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .order-card {
            background: #1e293b;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            max-width: 500px;
            margin: 0 auto;
        }

        .form-label {
            font-weight: 600;
            color: #94a3b8;
            margin-top: 10px;
        }

        .form-control, .form-select {
            background-color: #0f172a !important;
            border: 1px solid #475569 !important;
            color: #fff !important;
            border-radius: 8px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #f59e0b !important;
            box-shadow: none;
        }

        .charge-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            border: 1px dashed #475569;
        }

        .btn-order {
            background: linear-gradient(90deg, #f59e0b, #d97706);
            border: none;
            color: white;
            font-weight: bold;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="order-card">
        <h3 class="text-center mb-4" style="color: #f59e0b;">🔥 ABR PRO PANEL</h3>
        
        <label class="form-label">Category</label>
        <select id="mainCategory" class="form-select" onchange="filterServices()">
            <option value="">Select Category</option>
            <option value="fb">Facebook Services</option>
            <option value="yt">YouTube Services</option>
            <option value="tk">TikTok Services</option>
        </select>

        <label class="form-label">Service</label>
        <select id="serviceList" class="form-select" onchange="calculateTotal()">
            <option value="0">Select Service First</option>
        </select>

        <label class="form-label">Link</label>
        <input type="text" class="form-control" placeholder="https://example.com/profile">

        <label class="form-label">Quantity</label>
        <input type="number" id="quantity" class="form-control" placeholder="Min: 100 - Max: 10000" oninput="calculateTotal()">

        <div class="charge-box d-flex justify-content-between">
            <div>
                <small class="d-block text-secondary">Charge (USD)</small>
                <strong id="chargeUSD" class="text-warning fs-5">$0.000</strong>
            </div>
            <div class="text-end">
                <small class="d-block text-secondary">Charge (BDT)</small>
                <strong id="chargeBDT" class="text-success fs-5">৳0.00</strong>
            </div>
        </div>

        <button class="btn btn-order w-100" onclick="alert('Proceeding to Payment...')">PLACE ORDER NOW</button>
    </div>
</div>

<script>
    // সার্ভিস ডাটাবেস
    const services = {
        'fb': [
            {name: 'FB Followers (Real) - $1.50/1k', price: 1.50},
            {name: 'FB Likes (Instant) - $0.50/1k', price: 0.50}
        ],
        'yt': [
            {name: 'YT Subscribers - $2.50/1k', price: 2.50},
            {name: 'YT Views - $1.20/1k', price: 1.20}
        ],
        'tk': [
            {name: 'TikTok Followers - $0.80/1k', price: 0.80},
            {name: 'TikTok Views - $0.05/1k', price: 0.05}
        ]
    };

    const BDT_RATE = 130; // ১ ডলার = ১৩০ টাকা

    function filterServices() {
        const cat = document.getElementById('mainCategory').value;
        const list = document.getElementById('serviceList');
        list.innerHTML = '<option value="0">Select Service</option>';
        
        if(services[cat]) {
            services[cat].forEach(s => {
                let option = document.createElement('option');
                option.text = s.name;
                option.value = s.price;
                list.add(option);
            });
        }
        calculateTotal(); // রিসেট করার জন্য
    }

    function calculateTotal() {
        const pricePerK = document.getElementById('serviceList').value;
        const qty = document.getElementById('quantity').value;
        
        if(pricePerK > 0 && qty > 0) {
            const totalUSD = (pricePerK * qty) / 1000;
            const totalBDT = totalUSD * BDT_RATE;
            
            document.getElementById('chargeUSD').innerText = '$' + totalUSD.toFixed(3);
            document.getElementById('chargeBDT').innerText = '৳' + totalBDT.toFixed(2);
        } else {
            document.getElementById('chargeUSD').innerText = '$0.000';
            document.getElementById('chargeBDT').innerText = '৳0.00';
        }
    }
</script>

</body>
</html>
