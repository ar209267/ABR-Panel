<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Rocky - Services Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#eef2ff,#f8fafc);
    font-family:Segoe UI;
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
    color:#2563eb;
}

.header span{
    color:#16a34a;
}

/* CARD */
.service-card{
    background:#fff;
    border-radius:15px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    cursor:pointer;
    transition:0.3s;
}

.service-card:hover{
    transform:translateY(-3px);
}

/* ORDER BOX */
#order{
    display:none;
    background:#fff;
    padding:15px;
    border-radius:15px;
    margin-top:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

/* BALANCE */
.balance{
    text-align:center;
    font-weight:bold;
    color:#16a34a;
    margin-bottom:15px;
}

.btn-main{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    AR <span>Rocky FN</span>
</div>

<!-- BALANCE -->
<div class="balance">
Balance: ৳<span id="bal">0</span>
</div>

<!-- SERVICES -->
<div class="container">

<div class="service-card" onclick="openService('fb')">
📘 Facebook Marketing Services
</div>

<div class="service-card" onclick="openService('ig')">
📸 Instagram Promotion Services
</div>

<div class="service-card" onclick="openService('yt')">
▶️ YouTube Growth Services
</div>

<div class="service-card" onclick="openService('tt')">
🎵 TikTok Promotion Services
</div>

<div class="service-card" onclick="window.location.href='profile.html'">
👤 Profile / Wallet
</div>

<!-- ORDER -->
<div id="order">

<h5 id="title"></h5>

<select id="service" class="form-select mb-2" onchange="calc()"></select>

<input id="qty" class="form-control mb-2" value="1000" oninput="calc()">

<div class="p-2 bg-light rounded text-center mb-2">
Total: $<span id="total">0</span>
</div>

<button class="btn btn-warning btn-main"
onclick="window.location.href='profile.html'">
PLACE ORDER
</button>

</div>

</div>

<script>

// BALANCE
document.getElementById("bal").innerText =
localStorage.getItem("balance") || 0;

// DATA
const data = {

fb:{
title:"Facebook Services",
items:[
{name:"Page Promotion",price:1.5},
{name:"Post Engagement",price:0.8}
]
},

ig:{
title:"Instagram Services",
items:[
{name:"Profile Growth",price:1.2},
{name:"Content Boost",price:0.9}
]
},

yt:{
title:"YouTube Services",
items:[
{name:"Channel Promotion",price:2},
{name:"Video Boost",price:1.5}
]
},

tt:{
title:"TikTok Services",
items:[
{name:"Video Promotion",price:1},
{name:"Account Growth",price:1.8}
]
}

};

function openService(key){

let s=data[key];

document.getElementById("order").style.display="block";
document.getElementById("title").innerText=s.title;

let sel=document.getElementById("service");
sel.innerHTML="";

s.items.forEach(i=>{
let opt=document.createElement("option");
opt.value=i.price;
opt.text=i.name;
sel.appendChild(opt);
});

calc();

}

function calc(){

let price=document.getElementById("service").value;
let qty=document.getElementById("qty").value;

document.getElementById("total").innerText =
(price*qty/1000).toFixed(2);

}

</script>

</body>
</html>
