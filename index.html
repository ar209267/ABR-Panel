<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | ABR Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo" style="font-size:24px; font-weight:800; color:#2563eb;">ABR<span style="color:white;">Panel</span></div>
        <div class="nav-right" style="display:flex; align-items:center;">
            <div style="background:rgba(37,99,235,0.2); padding:8px 15px; border-radius:50px; border:1px solid #2563eb; margin-right:15px;">
                Balance: $0.00
            </div>
            <button onclick="window.location.href='login.html'" style="background:none; border:none; color:#94a3b8; cursor:pointer;"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <div class="wrapper">
        <aside class="sidebar">
            <ul style="list-style:none;">
                <li class="active" style="padding:15px; background:#2563eb; border-radius:12px; margin-bottom:10px; cursor:pointer;"><i class="fas fa-shopping-cart"></i> New Order</li>
                <li style="padding:15px; color:#94a3b8; cursor:pointer;" onclick="alert('History is empty')"><i class="fas fa-history"></i> Order History</li>
                <li style="padding:15px; color:#94a3b8; cursor:pointer;"><i class="fas fa-wallet"></i> Add Funds</li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="card-glass" style="max-width:700px; margin:0 auto;">
                <h2>Create New Order</h2>
                <form>
                    <label>Category</label>
                    <select><option>Facebook Followers [BD]</option></select>
                    <label>Link</label>
                    <input type="url" placeholder="https://facebook.com/..." required style="margin-bottom:15px;">
                    <button class="btn-main">Submit Order</button>
                </form>
            </div>
        </main>
    </div>

    <!-- Floating WhatsApp Support Button -->
    <a href="https://wa.me/8801766380931" target="_blank" style="position:fixed; bottom:20px; right:20px; background:#25d366; color:white; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:0 5px 15px rgba(0,0,0,0.3); text-decoration:none;">
        <i class="fab fa-whatsapp"></i>
    </a>

</body>
</html>
