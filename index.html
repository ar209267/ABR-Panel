<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Rocky FN - Digital Services</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6fb;
    font-family:Segoe UI;
}

.brand{
    text-align:center;
    padding:15px;
    font-size:26px;
    font-weight:bold;
    color:#0d6efd;
}

.brand span{
    color:#198754;
}

.card-box{
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:0.3s;
}

.card-box:hover{
    transform:scale(1.02);
}

#order{
    display:none;
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

</style>

</head>

<body>

<!-- BRAND -->
<div class="brand">
    AR <span>Rocky FN</span>
</div>

<!-- BALANCE -->
<h5 class="text-center">
Balance: ৳<span id="bal">0</span>
</h5>

<!-- SERVICES -->
<div class="container">

<div class="card-box" onclick="openService('fb')">
📘 Facebook Marketing Services
</div>

<div class="card-box" onclick="openService('ig')">
📸 Instagram Promotion Services
</div>

<div class="card-box" onclick="openService('yt')">
▶️ YouTube Channel Services
</div>

<div class="card-box" onclick="openService('tt')">
🎵 TikTok Promotion Services
</div>

<div class="card-box" onclick="window.location.href='profile.html'">
👤 Profile / Wallet
</div>

<!-- ORDER BOX -->
<div id="order">

<h5 id="title"></h5>

<select id="service" class="form-select mb-2" onchange="calc()"></select>

<input id="qty" class="form-control mb-2" value="1000" oninput="calc()">

<h5>Total Cost: $<span id="total">0</span></h5>

<button class="btn btn-warning w-100"
onclick="window.location.href='profile.html'">
Place Order
</button>

</div>

</div>

<script>

// BALANCE
document.getElementById("bal").innerText =
localStorage.getItem("balance") || 0;

// SAFE SERVICE DATA
const data = {

fb:{
title:"Facebook Marketing Services",
items:[
{name:"Page Promotion Campaign",price:1.5},
{name:"Post Engagement Campaign",price:0.8}
]
},

ig:{
title:"Instagram Services",
items:[
{name:"Profile Promotion",price:1.2},
{name:"Content Boost Campaign",price:0.9}
]
},

yt:{
title:"YouTube Services",
items:[
{name:"Channel Growth Support",price:2},
{name:"Video Promotion Campaign",price:1.5}
]
},

tt:{
title:"TikTok Services",
items:[
{name:"Video Promotion",price:1},
{name:"Account Growth Support",price:1.8}
]
}

};

function openService(key){

let s=data[key];

document.getElementById("order").style.display="block";
document.getElementById("title").innerText=s.title;

let sel=document.getElementById("service");
sel.innerHTML="";

s.items.forEach(i=>{
let opt=document.createElement("option");
opt.value=i.price;
opt.text=i.name;
sel.appendChild(opt);
});

calc();

}

function calc(){

let price=document.getElementById("service").value;
let qty=document.getElementById("qty").value;

document.getElementById("total").innerText =
(price*qty/1000).toFixed(2);

}

</script>

</body>
</html>
