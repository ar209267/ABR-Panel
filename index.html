<!DOCTYPE html>
<html>
<head>
<title>AR Rocky FN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Arial;
background:#f4f6fb;
text-align:center;
padding:30px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-top:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
padding:10px;
width:100%;
border:none;
border-radius:8px;
background:#0d6efd;
color:white;
font-weight:bold;
}
</style>

</head>

<body>

<h2>AR Rocky FN</h2>

<div class="box">

<h3>Login</h3>

<input id="user" placeholder="Username" style="padding:10px;width:100%;margin-bottom:10px;">
<input id="pass" type="password" placeholder="Password" style="padding:10px;width:100%;margin-bottom:10px;">

<button onclick="login()">Login</button>

</div>

<div id="dash" style="display:none" class="box">

<h3>Dashboard</h3>

<p>Welcome to AR Rocky FN Panel</p>

<button onclick="alert('Working OK')">Test Button</button>

</div>

<script>

function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u && p){
document.querySelector(".box").style.display="none";
document.getElementById("dash").style.display="block";
}else{
alert("Enter data");
}

}

</script>

</body>
</html>
