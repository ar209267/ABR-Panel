<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Rocky FN - Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6fb;
    font-family:Segoe UI;
}

/* BRAND */
.brand{
    text-align:center;
    padding:15px;
    font-size:26px;
    font-weight:bold;
    color:#0d6efd;
    letter-spacing:2px;
}

.brand span{
    color:#198754;
}

/* LOGIN */
#dashboard{display:none;padding:15px}

.login-box{
    max-width:400px;
    margin:auto;
    margin-top:100px;
}

/* UI BOX */
.glow-box{
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

/* CARD */
.card-hover{
    transition:0.3s;
    cursor:pointer;
}

.card-hover:hover{
    transform:scale(1.03);
}

.order-box{
    display:none;
    background:white;
    padding:15px;
    border-radius:15px;
    margin-top:15px;
}

</style>

</head>
<body>

<!-- BRAND -->
<div class="brand">
    AR <span>Rocky FN</span>
</div>

<!-- LOGIN -->
<div id="login-page" class="login-box">

<div class="glow-box">

<h3 class="text-center">LOGIN</h3>

<input id="user" class="form-control mb-2" placeholder="Username">
<input id="pass" type="password" class="form-control mb-2" placeholder="Password">

<button class="btn btn-primary w-100" onclick="login()">
Login
</button>

</div>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

<!-- HEADER -->
<div class="glow-box text-center mb-3">

<h3 class="fw-bold text-primary">
Welcome to AR Rocky FN
</h3>

<p class="text-muted">
SMM + Gaming Services Platform
</p>

<div class="row g-2">

<div class="col-6">
<div class="card p-2 card-hover">⚡ Fast Delivery</div>
</div>

<div class="col-6">
<div class="card p-2 card-hover">💰 Low Price</div>
</div>

<div class="col-6">
<div class="card p-2 card-hover">🔒 Secure</div>
</div>

<div class="col-6">
<div class="card p-2 card-hover">🚀 Instant</div>
</div>

</div>

</div>

<!-- BALANCE -->
<h5 class="text-success">
Balance: ৳<span id="bal">0</span>
</h5>

<!-- SERVICES -->
<div class="row g-2 mt-2">

<div class="col-6">
<div class="card p-3 text-center card-hover" onclick="openService('fb')">
📘 Facebook
</div>
</div>

<div class="col-6">
<div class="card p-3 text-center card-hover" onclick="openService('yt')">
▶️ YouTube
</div>
</div>

<div class="col-6">
<div class="card p-3 text-center card-hover" onclick="openService('ff')">
🎮 Free Fire
</div>
</div>

<div class="col-6">
<div class="card p-3 text-center card-hover" onclick="window.location.href='profile.html'">
👤 Profile
</div>
</div>

</div>

<!-- ORDER BOX -->
<div id="order-box" class="order-box">

<h5 id="title"></h5>

<select id="service" class="form-select mb-2" onchange="calc()"></select>

<input id="qty" class="form-control mb-2" value="1000" oninput="calc()">

<h5>Total: $<span id="total">0</span></h5>

<button class="btn btn-warning w-100"
onclick="window.location.href='profile.html'">
PLACE ORDER & PAY
</button>

</div>

</div>

<script>

// LOGIN
function login(){
document.getElementById("login-page").style.display="none";
document.getElementById("dashboard").style.display="block";
}

// DATA
const data={
fb:{
title:"Facebook",
items:[
{name:"Followers",price:1.2},
{name:"Likes",price:0.5}
]},
yt:{
title:"YouTube",
items:[
{name:"Views",price:2},
{name:"Subs",price:5}
]},
ff:{
title:"Free Fire",
items:[
{name:"Diamonds",price:1}
]}
};

function openService(k){

let s=data[k];

document.getElementById("order-box").style.display="block";
document.getElementById("title").innerText=s.title;

let sel=document.getElementById("service");
sel.innerHTML="";

s.items.forEach(i=>{
let o=document.createElement("option");
o.value=i.price;
o.text=i.name;
sel.appendChild(o);
});

calc();

}

function calc(){
let p=document.getElementById("service").value;
let q=document.getElementById("qty").value;
document.getElementById("total").innerText=(p*q/1000).toFixed(2);
}

</script>

</body>
</html>
