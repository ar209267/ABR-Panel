<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABR PRO | Premium SMM Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #FF8C00; --bg: #0B0E14; --card: #161B22; --text: #E6EDF3; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; height: 100vh; background: var(--card); padding: 20px; position: fixed; border-right: 1px solid #30363d; }
        .nav-item { padding: 12px; display: block; color: #8b949e; text-decoration: none; border-radius: 8px; margin-bottom: 10px; transition: 0.3s; }
        .nav-item.active { background: rgba(255, 140, 0, 0.1); color: var(--primary); }
        .main-content { margin-left: 250px; padding: 40px; width: 100%; }
        .order-box { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid #30363d; max-width: 600px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 8px; }
        .price-display { background: #1c2128; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; border: 1px dashed var(--primary); }
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color: var(--primary);">ABR PRO</h2>
        <a href="#" class="nav-item active"><i class="fas fa-plus-circle"></i> New Order</a>
        <a href="payment.php" class="nav-item"><i class="fas fa-wallet"></i> Add Funds (টাকা জমা)</a>
        <a href="admin.html" class="nav-item"><i class="fas fa-user-shield"></i> Admin Panel</a>
        <div style="margin-top: 50px;">
            <a href="login.html" class="nav-item"><i class="fas fa-sign-in-alt"></i> Login</a>
            <a href="signup.html" class="nav-item"><i class="fas fa-user-plus"></i> Sign Up</a>
        </div>
    </div>

    <div class="main-content">
        <div class="order-box">
            <h3><i class="fas fa-shopping-cart"></i> Create Order</h3>
            
            <label>Platform & Service</label>
            <select id="service" onchange="calculate()">
                <optgroup label="Facebook">
                    <option value="0.20">FB Followers (Mix) - $0.20/1k</option>
                    <option value="1.50">FB Followers (Real) - $1.50/1k</option>
                </optgroup>
                <optgroup label="TikTok">
                    <option value="0.05">TikTok Views - $0.05/1k</option>
                    <option value="0.80">TikTok Followers - $0.80/1k</option>
                </optgroup>
                <optgroup label="Others">
                    <option value="2.50">YouTube Subscribers - $2.50/1k</option>
                    <option value="0.40">Instagram Followers - $0.40/1k</option>
                </optgroup>
            </select>

            <label>Link</label>
            <input type="text" id="link" placeholder="https://social.com/profile">

            <label>Quantity</label>
            <input type="number" id="qty" placeholder="e.g. 1000" oninput="calculate()">

            <div class="price-display" id="priceBox">
                <div style="color: var(--primary); font-size: 20px; font-weight: bold;" id="usdPrice">$0.000 (USD)</div>
                <div style="color: #00ff00; font-size: 16px;" id="bdtPrice">৳0.00 (BDT)</div>
            </div>

            <form action="payment.php" method="POST">
                <input type="hidden" name="amount_bdt" id="finalBDT">
                <button type="submit" class="btn-submit">PLACE ORDER NOW (পেমেন্ট করুন)</button>
            </form>
        </div>
    </div>

    <script>
        function calculate() {
            const rate = parseFloat(document.getElementById('service').value);
            const qty = parseInt(document.getElementById('qty').value);
            const exchangeRate = 130; // ১ ডলার = ১৩০ টাকা

            if (qty > 0) {
                const totalUSD = (rate / 1000) * qty;
                const totalBDT = totalUSD * exchangeRate;

                document.getElementById('usdPrice').innerText = "$" + totalUSD.toFixed(3) + " (USD)";
                document.getElementById('bdtPrice').innerText = "৳" + totalBDT.toFixed(2) + " (BDT)";
                document.getElementById('finalBDT').value = totalBDT.toFixed(2);
            } else {
                document.getElementById('usdPrice').innerText = "$0.000 (USD)";
                document.getElementById('bdtPrice').innerText = "৳0.00 (BDT)";
            }
        }
    </script>
</body>
</html>
