<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABR PRO SMM PANEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        .card-custom {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .form-control, .form-select {
            background-color: #334155;
            border: 1px solid #475569;
            color: white;
        }
        .form-control:focus, .form-select:focus {
            background-color: #334155;
            color: white;
            border-color: #3b82f6;
            box-shadow: none;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-whatsapp:hover {
            background-color: #1da851;
            color: white;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-info">ABR PRO SMM PANEL</h2>
        <p class="text-secondary small">আপনার সার্ভিস সিলেক্ট করুন</p>
    </div>

    <div class="card-custom">
        <h5 class="mb-4 text-info">🛒 New Order</h5>
        <form>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select">
                    <option>Select Service</option>
                    <option>Facebook followers</option>
                    <option>YouTube Watchtime</option>
                    <option>Image Editing</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Link</label>
                <input type="text" class="form-control" placeholder="Paste your link here">
            </div>
            <div class="mb-4">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-control" placeholder="100">
            </div>
            <button type="button" class="btn btn-primary w-100 fw-bold">PLACE ORDER</button>
        </form>
    </div>

    <div class="card-custom text-center" style="border: 1px solid #25d366;">
        <h5 class="text-white mb-3">💬 সরাসরি যোগাযোগ ও পেমেন্ট</h5>
        <p class="text-secondary small">যেকোনো কাস্টম অর্ডার বা পেমেন্ট সংক্রান্ত সহায়তার জন্য সরাসরি হোয়াটসঅ্যাপ করুন।</p>
        
        <div class="d-grid gap-2 mb-4">
            <a href="https://wa.me/8801766380931" target="_blank" class="btn btn-whatsapp py-2">
                Message on WhatsApp
            </a>
        </div>

        <div class="p-3" style="background: #0f172a; border-radius: 10px; border: 1px dashed #3b82f6;">
            <p class="mb-1 text-secondary small">Manual Payment (বিকাশ/নগদ)</p>
            <h5 class="text-info">01766380931</h5>
        </div>
    </div>
</div>

</body>
</html>
