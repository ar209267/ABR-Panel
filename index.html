<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Panel - Order & Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card { max-width: 600px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .nav-tabs { border: none; justify-content: center; margin-bottom: 20px; }
        .nav-link { color: #666; border: none !important; font-weight: 600; }
        .nav-link.active { color: #0d6efd !important; border-bottom: 3px solid #0d6efd !important; background: none !important; }
        .charge-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px dashed #ddd; margin-top: 15px; }
        .btn-order { width: 100%; padding: 12px; font-weight: bold; text-transform: uppercase; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="order-tab" data-bs-toggle="tab" data-bs-target="#order" type="button">PLACE ORDER</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">LOG IN</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="order" role="tabpanel">
                <div class="mb-3">
                    <label class="form-label fw-bold">Category</label>
                    <select class="form-select" id="mainCategory" onchange="filterServices()">
                        <option value="0">Select Category</option>
                        <option value="fb">Facebook Services</option>
                        <option value="yt">YouTube Services</option>
                        <option value="ig">Instagram Services</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Service</label>
                    <select class="form-select" id="serviceList" onchange="calculateTotal()">
                        <option value="0">Select Service First</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Link</label>
                    <input type="text" class="form-control" placeholder="https://www.example.com/profile">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Quantity</label>
                    <input type="number" class="form-control" id="quantity" placeholder="e.g. 1000" oninput="calculateTotal()">
                </div>

                <div class="charge-box">
                    <div class="d-flex justify-content-between">
                        <span>Total Charge (USD):</span>
                        <span class="fw-bold text-primary" id="chargeUSD">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>Total Charge (BDT):</span>
                        <span class="fw-bold text-success" id="chargeBDT">৳0.00</span>
                    </div>
                </div>

                <button class="btn btn-primary btn-order">Place Order & Pay Now</button>
            </div>

            <div class="tab-pane fade" id="login" role="tabpanel">
                <h4 class="text-center mb-4">Welcome Back</h4>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter password">
                </div>
                <button class="btn btn-dark w-100 py-2">Login</button>
                <p class="text-center mt-3 small">Don't have an account? <a href="#">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // আপনার প্রফিট মার্জিনসহ আপডেট করা রেট
    const services = {
        'fb': [
            {name: 'FB Page Followers (Non-Drop) - $1.25/1k', price: 1.25},
            {name: 'FB Profile Followers (VIP) - $1.10/1k', price: 1.10},
            {name: 'FB Post Likes (Real Mix) - $0.45/1k', price: 0.45}
        ],
        'yt': [
            {name: 'YT Watch Time (Stable) - $12.50/1k', price: 12.50},
            {name: 'YT Subscribers (Non-Drop) - $4.80/1k', price: 4.80},
            {name: 'YT Organic Views - $2.50/1k', price: 2.50}
        ],
        'ig': [
            {name: 'IG Followers (Refill) - $0.85/1k', price: 0.85},
            {name: 'IG High Quality Likes - $0.30/1k', price: 0.30}
        ]
    };

    function filterServices() {
        const cat = document.getElementById('mainCategory').value;
        const list = document.getElementById('serviceList');
        list.innerHTML = '<option value="0">Select Service</option>';
        
        if(services[cat]) {
            services[cat].forEach(s => {
                let option = document.createElement('option');
                option.text = s.name;
                option.value = s.price;
                list.add(option);
            });
        }
        calculateTotal(); // Reset calculation
    }

    function calculateTotal() {
        const price = document.getElementById('serviceList').value;
        const qty = document.getElementById('quantity').value;
        const usdEl = document.getElementById('chargeUSD');
        const bdtEl = document.getElementById('chargeBDT');
        
        if(price > 0 && qty > 0) {
            const usd = (price * qty) / 1000;
            const bdtRate = 120; // ১ ডলার = ১২০ টাকা
            const bdt = usd * bdtRate;

            usdEl.innerText = '$' + usd.toFixed(2);
            bdtEl.innerText = '৳' + bdt.toFixed(2);
        } else {
            usdEl.innerText = '$0.00';
            bdtEl.innerText = '৳0.00';
        }
    }
</script>

</body>
</html>
