<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABR Panel - Pro SMM & Gaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; }
        .navbar { background-color: #161b22; border-bottom: 1px solid #30363d; padding: 12px; }
        .main-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-top: 15px; }
        
        /* সার্ভিস আইকন গ্রিড */
        .service-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .service-item { background: #21262d; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        .service-item:hover { border-color: #f78166; background: #30363d; }
        .service-item i { font-size: 20px; margin-bottom: 5px; display: block; }
        .service-item span { font-size: 11px; color: #8b949e; }

        .form-control, .form-select { background-color: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 8px; }
        .price-badge { background: #238636; color: white; padding: 2px 8px; border-radius: 5px; font-size: 12px; margin-left: 10px; }
        
        .btn-submit { background-color: #f78166; border: none; padding: 12px; font-weight: bold; width: 100%; border-radius: 8px; color: white; margin-top: 15px; }

        /* ফুটার নেভিগেশন */
        .footer-nav { position: fixed; bottom: 0; width: 100%; background: #161b22; display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #30363d; z-index: 1000; }
        .footer-nav a { color: #8b949e; text-decoration: none; font-size: 11px; text-align: center; }
        .footer-nav a i { font-size: 20px; margin-bottom: 3px; display: block; }
        .active-link { color: #f78166 !important; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="fw-bold"><i class="fas fa-bolt text-warning"></i> ABR SMM & GAMING</span>
        <button class="btn btn-sm btn-outline-info" data-bs-toggle="modal" data-bs-target="#fundModal">Add Fund</button>
    </div>
</nav>

<div class="container">
    <div class="service-grid">
        <div class="service-item"><i class="fab fa-facebook text-primary"></i><span>FB Service</span></div>
        <div class="service-item"><i class="fab fa-youtube text-danger"></i><span>YT Service</span></div>
        <div class="service-item"><i class="fas fa-gamepad text-warning"></i><span>FF Topup</span></div>
        <div class="service-item"><i class="fas fa-user-shield text-info"></i><span>FF ID Sale</span></div>
    </div>

    <div class="main-card">
        <h6 class="text-info mb-3"><i class="fas fa-plus-circle"></i> Place New Order</h6>
        <form>
            <div class="mb-3">
                <label class="small text-secondary">Select Category</label>
                <select class="form-select">
                    <option disabled selected>--- Social Media Services ---</option>
                    <option>FB Followers (৳150 per 1k)</option>
                    <option>FB Likes (৳80 per 1k)</option>
                    <option>FB Comments (৳200 per 1k)</option>
                    <option>YouTube Subscribers (৳600 per 1k)</option>
                    <option>YouTube Watchtime (৳1200 per 4k)</option>
                    <option disabled selected>--- Free Fire Gaming ---</option>
                    <option>Free Fire Diamond (Top-up)</option>
                    <option>Free Fire ID Sale (Check Below)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="small text-secondary">Target Link / Player ID</label>
                <input type="text" class="form-control" placeholder="পেইজ লিঙ্ক বা প্লেয়ার আইডি দিন">
            </div>

            <div class="mb-3">
                <label class="small text-secondary">Quantity</label>
                <input type="number" class="form-control" placeholder="কতটুকু লাগবে লিখুন">
            </div>

            <div class="p-3 mb-3" style="background: #0d1117; border-radius: 8px; border: 1px dashed #30363d;">
                <div class="d-flex justify-content-between">
                    <span class="small text-secondary">Total Charge:</span>
                    <span class="text-success fw-bold">৳ 0.00</span>
                </div>
            </div>

            <button type="submit" class="btn btn-submit">CONFIRM ORDER</button>
        </form>
    </div>

    <div class="main-card border-info">
        <h6 class="text-warning mb-3"><i class="fas fa-tags"></i> Exclusive Free Fire ID Sale</h6>
        <div class="d-flex justify-content-between align-items-center p-2 mb-2 bg-dark rounded">
            <span class="small">Level 65 + Evo Gun Skin</span>
            <span class="badge bg-danger">৳ 2,500</span>
        </div>
        <div class="d-flex justify-content-between align-items-center p-2 mb-2 bg-dark rounded">
            <span class="small">Old Season ID (S2-S10)</span>
            <span class="badge bg-danger">৳ 4,800</span>
        </div>
        <p class="text-center small text-muted mt-2">আইডি কেনার জন্য সরাসরি সাপোর্ট দিন।</p>
    </div>
</div>

<div class="modal fade" id="fundModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border-secondary">
            <div class="modal-header border-0">
                <h6 class="modal-title">Payment Method</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center p-4">
                <img src="https://www.logo.wine/a/logo/BKash/BKash-Logo.wine.svg" width="120" class="mb-3">
                <input type="text" class="form-control mb-3 text-center" placeholder="বিকাশ নম্বর দিন (017...)">
                <button class="btn btn-primary w-100 fw-bold">পেমেন্ট শুরু করুন</button>
            </div>
        </div>
    </div>
</div>

<div class="footer-nav">
    <a href="#" class="active-link"><i class="fas fa-home"></i>Home</a>
    <a href="#"><i class="fas fa-list"></i>Orders</a>
    <a href="https://wa.me/8801766380931" target="_blank"><i class="fab fa-whatsapp text-success"></i>Support</a>
    <a href="#"><i class="fas fa-user"></i>Account</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
