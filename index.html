    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABR Premium Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF8C00;
            --bg: #0B0E14;
            --card: #161B22;
            --text: #E6EDF3;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 250px; height: 100vh; background: var(--card); padding: 20px; position: fixed; border-right: 1px solid #30363d; }
        .nav-item { padding: 12px; display: block; color: #8b949e; text-decoration: none; border-radius: 8px; margin-bottom: 10px; }
        .nav-item.active { background: rgba(255,140,0,0.1); color: var(--primary); }

        /* Main */
        .main-content { margin-left: 250px; padding: 40px; width: 100%; }
        .order-box { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid #30363d; max-width: 600px; }
        
        input, select { 
            width: 100%; padding: 12px; margin: 10px 0 20px 0; 
            background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 8px; 
        }

        .price-tag { background: #1c2128; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color: var(--primary);">ABR Panel</h2>
        <a href="#" class="nav-item active"><i class="fas fa-shopping-cart"></i> New Order</a>
        <a href="admin.html" class="nav-item"><i class="fas fa-user-shield"></i> Admin Panel</a>
        <a href="payment.php" class="nav-item"><i class="fas fa-wallet"></i> Add Funds</a>
    </div>

    <div class="main-content">
        <div class="order-box">
            <h3>Place New Order</h3>
            
            <label>Service Type</label>
            <select id="service" onchange="calculate()">
                <option value="0.2">FB Followers (Mix) - $0.20 per 1k</option>
                <option value="1.5">FB Followers (Real) - $1.50 per 1k</option>
                <option value="3.3">FB Livestream React - $3.30 per 1k</option>
            </select>

            <label>Link</label>
            <input type="text" placeholder="https://facebook.com/yourprofile">

            <label>Quantity</label>
            <input type="number" id="qty" placeholder="Enter amount (e.g. 5000)" oninput="calculate()">

            <div class="price-tag" id="totalDisplay">Total Charge: $0.000</div>
            <br>
            <button class="btn">SUBMIT ORDER</button>
        </div>
    </div>

    <script>
        function calculate() {
            const pricePer1k = parseFloat(document.getElementById('service').value);
            const quantity = parseInt(document.getElementById('qty').value);
            const display = document.getElementById('totalDisplay');

            if (quantity > 0) {
                // ফর্মুলা: (১০০০ ফলোয়ারের দাম / ১০০০) * ইউজারের পরিমাণ
                const total = (pricePer1k / 1000) * quantity;
                display.innerText = "Total Charge: $" + total.toFixed(3);
            } else {
                display.innerText = "Total Charge: $0.000";
            }
        }
    </script>
</body>
</html>
