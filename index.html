<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABR PRO | Premium SMM Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: sans-serif; padding-top: 50px; }
        
        /* নেভিগেশন বার (লগইন বাটনের জন্য) */
        .navbar { background: #1e293b; border-bottom: 1px solid #334155; }
        
        .order-card {
            background: #1e293b; border-radius: 15px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155; max-width: 500px; margin: 0 auto;
        }

        .form-control, .form-select {
            background-color: #0f172a !important; border: 1px solid #475569 !important;
            color: #fff !important; border-radius: 8px; padding: 12px;
        }

        .charge-box {
            background: #0f172a; border-radius: 8px; padding: 15px;
            margin-top: 20px; border: 1px dashed #475569;
        }

        .btn-order {
            background: linear-gradient(90deg, #f59e0b, #d97706);
            border: none; color: white; font-weight: bold; padding: 15px;
            margin-top: 20px; border-radius: 8px; width: 100%; transition: 0.3s;
            text-decoration: none; display: inline-block; text-align: center;
        }
        
        .btn-login { border: 1px solid #f59e0b; color: #f59e0b; font-weight: bold; }
    </style>
</head>
<body>

<nav class="navbar fixed-top navbar-dark px-3">
    <a class="navbar-brand text-warning fw-bold" href="#">ABR PRO</a>
    <a href="login.html" class="btn btn-sm btn-login">Login / Sign Up</a>
</nav>

<div class="container mt-5">
    <div class="order-card">
        <h3 class="text-center mb-4" style="color: #f59e0b;">🔥 Create New Order</h3>
        
        <label class="mb-1">Category</label>
        <select id="mainCategory" class="form-select mb-3" onchange="filterServices()">
            <option value="">Select Category</option>
            <option value="fb">Facebook Services</option>
            <option value="yt">YouTube Services</option>
        </select>

        <label class="mb-1">Service</label>
        <select id="serviceList" class="form-select mb-3" onchange="calculateTotal()">
            <option value="0">Select Service First</option>
        </select>

        <label class="mb-1">Link</label>
        <input type="text" class="form-control mb-3" placeholder="Paste link here...">

        <label class="mb-1">Quantity</label>
        <input type="number" id="quantity" class="form-control" placeholder="100" oninput="calculateTotal()">

        <div class="charge-box d-flex justify-content-between">
            <div><small class="text-secondary">Charge (USD)</small><br><strong id="chargeUSD" class="text-warning">$0.000</strong></div>
            <div class="text-end"><small class="text-secondary">Charge (BDT)</small><br><strong id="chargeBDT" class="text-success">৳0.00</strong></div>
        </div>

        <a href="payment.html" class="btn btn-order">PLACE ORDER & PAY NOW</a>
    </div>
</div>

<script>
    const services = {
        'fb': [{name: 'FB Followers - $1.50/1k', price: 1.50}],
        'yt': [{name: 'YT Subscribers - $2.50/1k', price: 2.50}]
    };

    function filterServices() {
        const cat = document.getElementById('mainCategory').value;
        const list = document.getElementById('serviceList');
        list.innerHTML = '<option value="0">Select Service</option>';
        if(services[cat]) {
            services[cat].forEach(s => {
                let option = document.createElement('option');
                option.text = s.name; option.value = s.price; list.add(option);
            });
        }
    }

    function calculateTotal() {
        const price = document.getElementById('serviceList').value;
        const qty = document.getElementById('quantity').value;
        if(price > 0 && qty > 0) {
            const usd = (price * qty) / 1000;
            document.getElementById('chargeUSD').innerText = '$' + usd.toFixed(3);
            document.getElementById('chargeBDT').innerText = '৳' + (usd * 130).toFixed(2);
        }
    }
</script>
</body>
</html>
