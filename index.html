<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Rocky FN Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

body{
    background:#f0f2f5;
    font-family:Segoe UI;
}

#dashboard{display:none;padding:20px}

.login-card{
    max-width:400px;
    margin:auto;
    margin-top:120px;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.service-card{
    background:#fff;
    padding:15px;
    border-radius:10px;
    text-align:center;
    cursor:pointer;
    transition:0.2s;
}

.service-card:hover{
    transform:scale(1.03);
}

#order-box{
    display:none;
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

</style>

</head>

<body>

<!-- LOGIN -->
<div id="login-page" class="login-card">

<h3 class="text-center text-primary">LOGIN</h3>

<input id="user" class="form-control mb-2" placeholder="Username">
<input id="pass" type="password" class="form-control mb-2" placeholder="Password">

<button class="btn btn-primary w-100" onclick="login()">
Login
</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

<h4>AR Rocky FN Panel</h4>

<div class="row g-2">

<div class="col-6">
<div class="service-card" onclick="openService('fb')">
Facebook
</div>
</div>

<div class="col-6">
<div class="service-card" onclick="openService('yt')">
YouTube
</div>
</div>

<div class="col-6 mt-2">
<div class="service-card" onclick="openService('ff')">
Free Fire
</div>
</div>

<div class="col-6 mt-2">
<div class="service-card" onclick="openService('id')">
ID Sale
</div>
</div>

</div>

<!-- ORDER -->
<div id="order-box">

<h5 id="title"></h5>

<select id="service" class="form-select mb-2" onchange="calc()"></select>

<input id="qty" class="form-control mb-2" value="1000" oninput="calc()">

<h5>Total: $<span id="total">0</span></h5>

<button class="btn btn-warning w-100"
onclick="window.location.href='add-funds.html'">
PLACE ORDER & PAY
</button>

</div>

</div>

<script>

function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(!u || !p){
alert("Enter login info");
return;
}

document.getElementById("login-page").style.display="none";
document.getElementById("dashboard").style.display="block";
}

// SAFE DATA
const data={
fb:{title:"Facebook Services",items:[
{name:"Page Promotion",price:1.2},
{name:"Post Boost",price:0.6}
]},
yt:{title:"YouTube Services",items:[
{name:"Views",price:2},
{name:"Subscribers",price:5}
]},
ff:{title:"Free Fire",items:[
{name:"Diamonds",price:1},
{name:"Membership",price:2}
]},
id:{title:"ID Sale",items:[
{name:"Game ID",price:10},
{name:"Old Account",price:3}
]}
};

function openService(key){

let d=data[key];

if(!d) return;

document.getElementById("order-box").style.display="block";
document.getElementById("title").innerText=d.title;

let sel=document.getElementById("service");
sel.innerHTML="";

d.items.forEach(i=>{
let op=document.createElement("option");
op.value=i.price;
op.text=i.name;
sel.appendChild(op);
});

calc();

}

function calc(){

let p=document.getElementById("service").value;
let q=document.getElementById("qty").value;

if(!p || !q) return;

document.getElementById("total").innerText =
((p*q)/1000).toFixed(2);

}

</script>

</body>
</html>
