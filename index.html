<!DOCTYPE html>
<html>
<head>
<title>AR Rocky FN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-3">

<h3 class="text-center text-primary">AR Rocky FN</h3>

<h5>Balance: ৳<span id="bal">0</span></h5>

<div class="card p-3 mb-2" onclick="openService('fb')">Facebook</div>
<div class="card p-3 mb-2" onclick="openService('yt')">YouTube</div>

<div id="order" class="card p-3 mt-3" style="display:none">

<h5 id="title"></h5>

<select id="service" class="form-select mb-2" onchange="calc()"></select>

<input id="qty" class="form-control mb-2" value="1000" oninput="calc()">

<h5>Total: $<span id="total">0</span></h5>

<button class="btn btn-warning w-100"
onclick="window.location.href='profile.html'">
Place Order
</button>

</div>

<script>

function loadBal(){
document.getElementById("bal").innerText =
localStorage.getItem("balance") || 0;
}
loadBal();

const data={
fb:{title:"Facebook",items:[
{name:"Followers",price:1.2},
{name:"Likes",price:0.5}
]},
yt:{title:"YouTube",items:[
{name:"Views",price:2},
{name:"Subs",price:5}
]}
};

function openService(k){
let s=data[k];

document.getElementById("order").style.display="block";
document.getElementById("title").innerText=s.title;

let sel=document.getElementById("service");
sel.innerHTML="";

s.items.forEach(i=>{
let o=document.createElement("option");
o.value=i.price;
o.text=i.name;
sel.appendChild(o);
});

calc();
}

function calc(){
let p=document.getElementById("service").value;
let q=document.getElementById("qty").value;

document.getElementById("total").innerText =
(p*q/1000).toFixed(2);
}

</script>

</body>
</html>
