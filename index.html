<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Rocky FN</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6fb;
    font-family:Segoe UI;
}

/* SINGLE BRAND ONLY */
.brand{
    text-align:center;
    padding:15px;
    font-size:28px;
    font-weight:bold;
    color:#0d6efd;
    letter-spacing:1px;
}

/* LAYOUT */
.container-box{
    max-width:500px;
    margin:auto;
}

/* CARD */
.card-box{
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:0.3s;
}

.card-box:hover{
    transform:scale(1.02);
}

/* ORDER */
#order{
    display:none;
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

</style>

</head>

<body>

<!-- ONLY ONE NAME -->
<div class="brand">
    AR Rocky FN
</div>

<div class="container-box p-3">

<!-- BALANCE -->
<h5 class="text-center">
Balance: ৳<span id="bal">0</span>
</h5>

<!-- SERVICES -->
<div class="card-box" onclick="openService('fb')">
📘 Facebook Services
</div>

<div class="card-box" onclick="openService('yt')">
▶️ YouTube Services
</div>

<div class="card-box" onclick="window.location.href='profile.html'">
👤 Profile / Wallet
</div>

<!-- ORDER BOX -->
<div id="order">

<h5 id="title"></h5>

<select id="service" class="form-select mb-2" onchange="calc()"></select>

<input id="qty" class="form-control mb-2" value="1000" oninput="calc()">

<h5>Total: $<span id="total">0</span></h5>

<button class="btn btn-warning w-100"
onclick="window.location.href='profile.html'">
Place Order
</button>

</div>

</div>

<script>

// LOAD BALANCE
document.getElementById("bal").innerText =
localStorage.getItem("balance") || 0;

// SERVICES DATA
const data={
fb:{
title:"Facebook Services",
items:[
{name:"Page Promotion",price:1.2},
{name:"Post Boost",price:0.8}
]
},
yt:{
title:"YouTube Services",
items:[
{name:"Video Promotion",price:2},
{name:"Channel Growth",price:3}
]
}
};

function openService(key){

let s=data[key];

document.getElementById("order").style.display="block";
document.getElementById("title").innerText=s.title;

let sel=document.getElementById("service");
sel.innerHTML="";

s.items.forEach(i=>{
let opt=document.createElement("option");
opt.value=i.price;
opt.text=i.name;
sel.appendChild(opt);
});

calc();

}

function calc(){

let price=document.getElementById("service").value;
let qty=document.getElementById("qty").value;

document.getElementById("total").innerText =
(price*qty/1000).toFixed(2);

}

</script>

</body>
</html>
