<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Funds - ABR PANEL</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f1f5f9;
    font-family:Segoe UI;
}

.main-box{
    max-width:500px;
    margin:auto;
    margin-top:40px;
}

.card-box{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.pay-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    margin-top:10px;
}

.method{
    border:2px solid #eee;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
    cursor:pointer;
    transition:0.3s;
}

.method:hover{
    border-color:#0d6efd;
    background:#f8fbff;
}

.number{
    font-size:20px;
    font-weight:bold;
    color:#198754;
}

</style>
</head>

<body>

<div class="container">

<div class="main-box">

    <!-- HEADER -->
    <div class="card-box text-center">

        <h2 class="fw-bold">
            ADD FUNDS
        </h2>

        <p class="text-muted">
            Send Money & Recharge Balance
        </p>

    </div>

    <!-- PAYMENT METHODS -->
    <div class="card-box">

        <h5 class="fw-bold mb-3">
            Payment Methods
        </h5>

        <div class="method">

            <h6 class="fw-bold">
                Bkash Personal
            </h6>

            <div class="number">
                01766380931
            </div>

        </div>

        <div class="method">

            <h6 class="fw-bold">
                Nagad Personal
            </h6>

            <div class="number">
                01766380931
            </div>

        </div>

        <div class="method">

            <h6 class="fw-bold">
                Rocket
            </h6>

            <div class="number">
                01766380931
            </div>

        </div>

    </div>

    <!-- PAYMENT FORM -->
    <div class="card-box">

        <h5 class="fw-bold mb-3">
            Submit Payment
        </h5>

        <div class="mb-3">

            <label class="form-label">
                Your Number
            </label>

            <input type="text"
            class="form-control"
            placeholder="Enter your number">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Amount
            </label>

            <input type="number"
            class="form-control"
            placeholder="Enter amount">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Transaction ID
            </label>

            <input type="text"
            class="form-control"
            placeholder="Enter transaction ID">

        </div>

        <button
        onclick="successPay()"
        class="btn btn-success pay-btn">

        SUBMIT PAYMENT

        </button>

    </div>

    <!-- BACK BUTTON -->
    <button
    onclick="window.location.href='profile.html'"
    class="btn btn-dark pay-btn">

    BACK TO PROFILE

    </button>

</div>

</div>

<script>

function successPay(){

    alert("Payment Submitted Successfully!");

}

</script>

</body>
</html>
