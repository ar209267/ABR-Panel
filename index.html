<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABR PANEL - Services</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6fb;
    font-family:Segoe UI;
}

.header{
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
    color:#0d6efd;
}

.card-box{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:0.3s;
}

.card-box:hover{
    transform:scale(1.03);
}

#services{
    display:none;
    background:white;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

.service-item{
    border:1px solid #eee;
    padding:10px;
    border-radius:10px;
    margin-bottom:8px;
}

</style>

</head>

<body>

<div class="header">
ABR PANEL
</div>

<div class="container">

<!-- FACEBOOK -->
<div class="card-box" onclick="openCat('fb')">
📘 Facebook Marketing Services
</div>

<!-- INSTAGRAM -->
<div class="card-box" onclick="openCat('ig')">
📸 Instagram Promotion Services
</div>

<!-- TIKTOK -->
<div class="card-box" onclick="openCat('tt')">
🎵 TikTok Growth Services
</div>

<!-- YOUTUBE -->
<div class="card-box" onclick="openCat('yt')">
▶️ YouTube Channel Services
</div>

<!-- FREE FIRE -->
<div class="card-box" onclick="openCat('ff')">
🎮 Free Fire Top-up & ID Services
</div>

<!-- SERVICE BOX -->
<div id="services">

<h4 id="title"></h4>

<div id="list"></div>

<button class="btn btn-warning w-100 mt-2">
ORDER NOW
</button>

</div>

</div>

<script>

const data={

fb:{
title:"Facebook Marketing Services",
items:[
{name:"Page Promotion Campaign",price:2},
{name:"Content Boost Strategy",price:1.5},
{name:"Engagement Optimization",price:1.8}
]
},

ig:{
title:"Instagram Services",
items:[
{name:"Profile Growth Campaign",price:1.5},
{name:"Reels Promotion",price:1.2},
{name:"Brand Awareness Boost",price:2}
]
},

tt:{
title:"TikTok Services",
items:[
{name:"Video Promotion",price:1.3},
{name:"Audience Growth Strategy",price:1.8}
]
},

yt:{
title:"YouTube Services",
items:[
{name:"Video Promotion Campaign",price:2.5},
{name:"Channel Optimization",price:3}
]
},

ff:{
title:"Free Fire Services",
items:[
{name:"Diamond Top-up",price:0.02},
{name:"ID Listing Service",price:5}
]
}

};

function openCat(key){

let s=data[key];

document.getElementById("services").style.display="block";
document.getElementById("title").innerText=s.title;

let list=document.getElementById("list");
list.innerHTML="";

s.items.forEach(i=>{

list.innerHTML+=`
<div class="service-item">
<b>${i.name}</b><br>
Price: $${i.price}
</div>
`;

});

}

</script>

</body>
</html>
