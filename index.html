<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABR Panel - Professional SMM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; padding-bottom: 70px; }
        .navbar { background-color: #161b22; border-bottom: 1px solid #30363d; padding: 15px; }
        .main-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .form-control, .form-select { background-color: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 8px; }
        .form-control:focus { background-color: #0d1117; color: white; border-color: #58a6ff; box-shadow: none; }
        
        /* সার্ভিস গ্রিড */
        .service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
        .service-item { background: #21262d; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .service-item:hover { border-color: #f78166; background: #30363d; }
        .service-item i { font-size: 24px; margin-bottom: 8px; display: block; }

        .btn-submit { background-color: #f78166; border: none; padding: 14px; font-weight: bold; width: 100%; border-radius: 8px; color: white; margin-top: 15px; }
        
        /* পেমেন্ট গেটওয়ে পপআপ স্টাইল */
        .modal-content { background-color: #161b22; border: 1px solid #30363d; color: white; }
        .bkash-header { background: #e2136e; padding: 15px; text-align: center; border-radius: 8px 8px 0 0; }
        
        /* ফুটার নেভিগেশন */
        .footer-nav { position: fixed; bottom: 0; width: 100%; background: #161b22; display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #30363d; z-index: 1000; }
        .footer-nav a { color: #8b949e; text-decoration: none; font-size: 12px; text-align: center; }
        .footer-nav a.active { color: #f78166; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="fw-bold fs-5"><i class="fas fa-fire text-danger"></i> ABR SMM</span>
        <button class="btn btn-outline-warning btn-sm" data-bs-toggle="modal" data-bs-target="#paymentModal">
            <i class="fas fa-wallet"></i> Add Fund
        </button>
    </div>
</nav>

<div class="container">
    <div class="service-grid">
        <div class="service-item"><i class="fab fa-facebook text-primary"></i><span>FB</span></div>
        <div class="service-item"><i class="fab fa-youtube text-danger"></i><span>YT</span></div>
        <div class="service-item"><i class="fas fa-gamepad text-warning"></i><span>FF</span></div>
    </div>

    <div class="main-card">
        <h6 class="text-secondary mb-3"><i class="fas fa-cart-plus"></i> New Order</h6>
        <form>
            <div class="mb-3">
                <label class="small text-secondary">Category</label>
                <select class="form-select">
                    <option>Free Fire Diamond Top-up</option>
                    <option>Free Fire ID Sale</option>
                    <option>Social Media Services</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="small text-secondary">Player ID / Link</label>
                <input type="text" class="form-control" placeholder="Ex: 28374625">
            </div>
            <button type="submit" class="btn btn-submit">PLACE ORDER</button>
        </form>
    </div>
</div>

<div class="modal fade" id="paymentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="bkash-header">
                <img src="https://www.logo.wine/a/logo/BKash/BKash-Logo.wine.svg" width="100" alt="bkash">
            </div>
            <div class="modal-body text-center p-4">
                <h5 class="mb-3">Pay with bKash</h5>
                <p class="small text-secondary">আপনার বিকাশ নম্বরটি লিখুন</p>
                <input type="text" class="form-control mb-3 text-center" placeholder="017XXXXXXXX">
                <p class="extra-small text-muted" style="font-size: 10px;">By clicking, you agree to the terms and conditions</p>
                <button class="btn btn-light w-100 fw-bold">PROCEED</button>
            </div>
        </div>
    </div>
</div>

<div class="footer-nav">
    <a href="#" class="active"><i class="fas fa-home d-block fs-5"></i>Home</a>
    <a href="#"><i class="fas fa-shopping-bag d-block fs-5"></i>Orders</a>
    <a href="https://wa.me/8801766380931" target="_blank"><i class="fab fa-whatsapp d-block fs-5 text-success"></i>Support</a>
    <a href="#"><i class="fas fa-user-circle d-block fs-5"></i>Account</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
