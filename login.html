<!DOCTYPE html>
<html>
<head>
<title>AR Rocky FN Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-3">

<h2 class="text-center text-primary">AR Rocky FN</h2>

<div class="card p-3">

<h4>Login</h4>

<input class="form-control mb-2" placeholder="Email">

<input class="form-control mb-2" type="password" placeholder="Password">

<button class="btn btn-primary w-100">
Login
</button>

<button onclick="googleLogin()" class="btn btn-danger w-100 mt-2">
Login with Google
</button>

</div>

<script type="module">

import { getAuth, GoogleAuthProvider, signInWithPopup }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { app } from "./firebase.js";

const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.googleLogin = function(){

signInWithPopup(auth, provider)
.then(()=>{
window.location.href="index.html";
})
.catch(()=>{
alert("Google Login Failed");
});

}

</script>

</body>
</html>
