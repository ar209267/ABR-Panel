<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ABR Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a; /* আপনার থিমের সাথে মিল রেখে ডার্ক ব্যাকগ্রাউন্ড */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .login-card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px; /* ফর্মটি ছোট এবং মিডিলে রাখার জন্য */
        }
        .btn-primary {
            background-color: #3b82f6;
            border: none;
        }
        .form-control {
            background-color: #334155;
            border: 1px solid #475569;
            color: white;
        }
        .form-control:focus {
            background-color: #334155;
            color: white;
            box-shadow: none;
            border-color: #3b82f6;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-info">ABR Panel</h2>
        <p class="text-secondary">Please login to continue</p>
    </div>
    
    <form action="index.html"> <div class="mb-3">
            <label class="form-label">Email or Username</label>
            <input type="text" class="form-control" placeholder="Enter username">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Enter password">
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary py-2">Login to Dashboard</button>
        </div>
    </form>
    
    <div class="text-center mt-3">
        <small class="text-secondary">Don't have an account? <a href="#" class="text-info text-decoration-none">Sign Up</a></small>
    </div>
</div>

</body>
</html>
